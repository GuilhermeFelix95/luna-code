<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Luna Code</title>
  </head>
  <body>
    <div id="layout">
      <nav id="sidebar" aria-label="Navegação">
        <div class="sidebar-actions">
          <button type="button" id="new-chat" class="sidebar-action">
            <span aria-hidden="true">＋</span> Nova conversa
          </button>
          <button type="button" id="add-project" class="sidebar-action">
            <span aria-hidden="true">📁</span> Adicionar projeto
          </button>
        </div>
        <section class="sidebar-projects">
          <h2 class="sidebar-section-title">Projetos</h2>
          <div id="chat-list"></div>
        </section>
        <section class="sidebar-terminals">
          <div class="sidebar-section-header">
            <h2 class="sidebar-section-title">Terminais</h2>
            <button
              type="button"
              id="new-shell"
              class="sidebar-icon-action"
              aria-label="Novo terminal"
              title="Novo terminal"
            >
              <span aria-hidden="true">＋</span>
            </button>
          </div>
          <ul id="session-list"></ul>
        </section>
      </nav>
      <main id="welcome">
        <h1>Luna Code</h1>
        <p>
          Adicione uma pasta como projeto para começar. Cada conversa roda
          dentro do projeto dela.
        </p>
        <button type="button" id="welcome-add-project" class="primary">
          Adicionar projeto
        </button>
      </main>
      <main id="chat" hidden></main>
      <main id="terminal" hidden></main>
    </div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" id="confirm-cancel">
            Cancelar
          </button>
          <button type="submit" value="ok" id="confirm-action" class="danger">
            Confirmar
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
